name: Deploy to GitHub Pages

on:
  push:
    branches: [main, "claude/hopeful-thompson-8i5a79"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate playlist.json
        run: python3 -c "import json; d=json.load(open('playlist.json')); assert isinstance(d['items'], list) and d['items'], 'items is empty'; print(len(d['items']), 'items')"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
